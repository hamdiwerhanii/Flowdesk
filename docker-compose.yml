services:
  postgres:
    image: postgres:16-alpine
    container_name: flowdesk-postgres
    environment:
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk
      POSTGRES_DB: flowdesk
    ports:
      - "5433:5432"
    volumes:
      - flowdesk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: flowdesk-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    profiles: ["app"]
    build: ./backend
    container_name: flowdesk-backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://flowdesk:flowdesk@postgres:5432/flowdesk?schema=public
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    container_name: flowdesk-frontend
    environment:
      INTERNAL_BACKEND_URL: http://backend:4000
    ports:
      - "3005:3005"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  flowdesk-pgdata:
